name: Build Unminified Plugins

on:
  workflow_dispatch:
  repository_dispatch:
    types: [lnreader-release]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo branch
        uses: actions/checkout@v4
        with:
          ref: repo
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Clone and build LNReader plugins
        run: |
          git clone --depth 1 https://github.com/LNReader/lnreader-plugins lnreader-source
          cd lnreader-source
          
          echo "Installing dependencies..."
          npm ci
          
          echo "Building plugins..."
          npm run clean:multisrc
          npm run build:multisrc
          npm run build:compile
          npm run build:manifest
          
          echo "✅ Build complete"
          
          # Show plugin count
          if [ -d ".js/src/plugins" ]; then
            total=$(find .js/src/plugins -name "*.js" -type f | wc -l)
            echo "Total compiled plugins: $total"
          fi
      
      - name: Install bundling tools
        run: |
          npm install --no-save esbuild esbuild-plugin-polyfill-node
      
      - name: Find plugins directory
        run: |
          cd lnreader-source
          
          echo "Searching for plugins directory..."
          echo ""
          echo "Root structure:"
          ls -la | head -20
          echo ""
          
          # Check possible locations
          for dir in ".js/src/plugins" ".js/plugins" "src/plugins" "plugins" "dist/plugins" ".dist/plugins"; do
            if [ -d "$dir" ]; then
              echo "✅ Found: $dir"
              ls -la "$dir" | head -10
            fi
          done
          
          # Find any .js files in plugins directories
          echo ""
          echo "Searching for plugin files..."
          find . -type f -name "*.js" -path "*/plugins/*" | head -20
      
      - name: Create ICU polyfill file
        run: |
          cat > lnreader-source/icu-polyfill.js << 'POLYFILL_EOF'
          // === ICU-FREE POLYFILLS (prevents GraalVM ICU errors) ===
          (function() {
            var SafeIntl = {
              DateTimeFormat: function(locale, options) {
                this.locale = locale || 'en';
                this.options = options || {};
              },
              NumberFormat: function(locale, options) {
                this.locale = locale || 'en';
                this.options = options || {};
              },
              Collator: function(locale, options) {
                this.locale = locale || 'en';
                this.options = options || {};
              },
              PluralRules: function(locale, options) {
                this.locale = locale || 'en';
                this.options = options || {};
              },
              RelativeTimeFormat: function(locale, options) {
                this.locale = locale || 'en';
                this.options = options || {};
              }
            };
            SafeIntl.DateTimeFormat.prototype.format = function(date) {
              if (!date) return '';
              try {
                var d = date instanceof Date ? date : new Date(date);
                if (isNaN(d.getTime())) return '';
                var year = d.getFullYear();
                var month = String(d.getMonth() + 1).padStart(2, '0');
                var day = String(d.getDate()).padStart(2, '0');
                var hours = String(d.getHours()).padStart(2, '0');
                var minutes = String(d.getMinutes()).padStart(2, '0');
                var seconds = String(d.getSeconds()).padStart(2, '0');
                return year + '-' + month + '-' + day + ' ' + hours + ':' + minutes + ':' + seconds;
              } catch (e) { return ''; }
            };
            SafeIntl.DateTimeFormat.prototype.formatToParts = function(date) {
              var d = date instanceof Date ? date : new Date(date);
              return [
                {type: 'year', value: String(d.getFullYear())},
                {type: 'literal', value: '-'},
                {type: 'month', value: String(d.getMonth() + 1).padStart(2, '0')},
                {type: 'literal', value: '-'},
                {type: 'day', value: String(d.getDate()).padStart(2, '0')}
              ];
            };
            SafeIntl.DateTimeFormat.prototype.resolvedOptions = function() {
              return {locale: this.locale, calendar: 'gregory', timeZone: 'UTC'};
            };
            SafeIntl.DateTimeFormat.supportedLocalesOf = function() { return ['en']; };
            SafeIntl.NumberFormat.prototype.format = function(num) { return String(num); };
            SafeIntl.NumberFormat.prototype.formatToParts = function(num) {
              return [{type: 'integer', value: String(Math.floor(num))}];
            };
            SafeIntl.NumberFormat.prototype.resolvedOptions = function() {
              return {locale: this.locale, style: 'decimal'};
            };
            SafeIntl.NumberFormat.supportedLocalesOf = function() { return ['en']; };
            SafeIntl.Collator.prototype.compare = function(a, b) {
              return String(a).localeCompare(String(b));
            };
            SafeIntl.Collator.prototype.resolvedOptions = function() {
              return {locale: this.locale};
            };
            SafeIntl.Collator.supportedLocalesOf = function() { return ['en']; };
            SafeIntl.PluralRules.prototype.select = function(n) {
              return n === 1 ? 'one' : 'other';
            };
            SafeIntl.PluralRules.prototype.resolvedOptions = function() {
              return {locale: this.locale, type: 'cardinal'};
            };
            SafeIntl.PluralRules.supportedLocalesOf = function() { return ['en']; };
            SafeIntl.RelativeTimeFormat.prototype.format = function(value, unit) {
              var abs = Math.abs(value);
              var suffix = value < 0 ? ' ago' : ' from now';
              return abs + ' ' + unit + (abs !== 1 ? 's' : '') + suffix;
            };
            SafeIntl.RelativeTimeFormat.prototype.resolvedOptions = function() {
              return {locale: this.locale};
            };
            SafeIntl.RelativeTimeFormat.supportedLocalesOf = function() { return ['en']; };
            try { globalThis.Intl = SafeIntl; } catch(e) {}
            try { if (typeof global !== 'undefined') global.Intl = SafeIntl; } catch(e) {}
            try { if (typeof window !== 'undefined') window.Intl = SafeIntl; } catch(e) {}
            try { if (typeof self !== 'undefined') self.Intl = SafeIntl; } catch(e) {}
            Date.prototype.toLocaleString = function() {
              try {
                return this.getFullYear() + '-' + String(this.getMonth()+1).padStart(2,'0') + '-' + 
                       String(this.getDate()).padStart(2,'0') + ' ' + String(this.getHours()).padStart(2,'0') + 
                       ':' + String(this.getMinutes()).padStart(2,'0') + ':' + String(this.getSeconds()).padStart(2,'0');
              } catch(e) { return this.toISOString(); }
            };
            Date.prototype.toLocaleDateString = function() {
              try {
                return this.getFullYear() + '-' + String(this.getMonth()+1).padStart(2,'0') + '-' + String(this.getDate()).padStart(2,'0');
              } catch(e) { return this.toISOString().split('T')[0]; }
            };
            Date.prototype.toLocaleTimeString = function() {
              try {
                return String(this.getHours()).padStart(2,'0') + ':' + String(this.getMinutes()).padStart(2,'0') + ':' + String(this.getSeconds()).padStart(2,'0');
              } catch(e) { return this.toISOString().split('T')[1].split('.')[0]; }
            };
          })();
          // === END ICU-FREE POLYFILLS ===
          POLYFILL_EOF
      
      - name: Bundle all plugins
        run: |
          cd lnreader-source
          
          echo "Creating bundling script..."
          
          cat > bundle-all-plugins.js << 'EOF'
          import { build } from 'esbuild';
          import { polyfillNode } from 'esbuild-plugin-polyfill-node';
          import fs from 'fs';
          import path from 'path';
          
          const possibleDirs = [
            path.join('.js', 'src', 'plugins'),
            path.join('.js', 'plugins'),
            path.join('src', 'plugins'),
            path.join('plugins'),
            path.join('dist', 'plugins'),
            path.join('.dist', 'plugins')
          ];
          
          let pluginsBaseDir = null;
          for (const dir of possibleDirs) {
            if (fs.existsSync(dir)) {
              pluginsBaseDir = dir;
              console.log('Found plugins directory: ' + dir + '\n');
              break;
            }
          }
          
          if (!pluginsBaseDir) {
            console.error('Plugins directory not found');
            process.exit(1);
          }
          
          // Read the ICU polyfill
          const icuPolyfill = fs.readFileSync('icu-polyfill.js', 'utf-8');
          const bannerJs = '// Bundled plugin for LNReader/IReader (GraalVM/J2V8 compatible)\n' + icuPolyfill + '\n';
          
          async function bundlePlugin(inputFile, outputFile) {
            const config = {
              entryPoints: [inputFile],
              bundle: true,
              format: 'iife',
              platform: 'browser',
              target: 'es2020',
              outfile: outputFile,
              minify: false,
              keepNames: true,
              sourcemap: false,
              treeShaking: false,
              legalComments: 'inline',
              banner: { js: bannerJs },
              footer: { js: '\nif (typeof module !== "undefined" && module.exports) { module.exports = this; }\n' },
              globalName: 'LNReaderPlugin',
              plugins: [
                polyfillNode({
                  polyfills: {
                    stream: true,
                    buffer: true,
                    process: true,
                    util: true,
                    events: true,
                    fs: false,
                    path: false
                  }
                })
              ],
              external: [],
              mainFields: ['module', 'main'],
              conditions: ['import', 'require', 'default'],
              logLevel: 'error',
              logOverride: { 'commonjs-variable-in-esm': 'silent' }
            };
            
            try {
              await build(config);
              return true;
            } catch (error) {
              console.error('Failed to bundle ' + path.basename(inputFile) + ': ' + error.message);
              return false;
            }
          }
          
          async function bundleAllPlugins() {
            const skipPatterns = ['generator.js', 'generate-multisrc-plugins.js', 'get_filters.js', 'filter_refresh.js', 'template.js'];
            
            const languages = fs.readdirSync(pluginsBaseDir).filter(item => {
              const fullPath = path.join(pluginsBaseDir, item);
              return fs.statSync(fullPath).isDirectory();
            });
            
            console.log('Found ' + languages.length + ' languages\n');
            
            let totalSuccess = 0;
            let totalFiles = 0;
            
            for (const language of languages) {
              const pluginsDir = path.join(pluginsBaseDir, language);
              const outputDir = path.join('.bundled', 'plugins', language);
              
              const pluginFiles = fs.readdirSync(pluginsDir)
                .filter(file => file.endsWith('.js') && !skipPatterns.includes(file))
                .map(file => path.join(pluginsDir, file));
              
              if (pluginFiles.length === 0) continue;
              
              console.log('\nBundling ' + language + ' (' + pluginFiles.length + ' plugins)...');
              fs.mkdirSync(outputDir, { recursive: true });
              
              let successCount = 0;
              
              for (const inputFile of pluginFiles) {
                const fileName = path.basename(inputFile);
                const outputFile = path.join(outputDir, fileName);
                
                const success = await bundlePlugin(inputFile, outputFile);
                if (success) {
                  successCount++;
                  if (successCount % 10 === 0) {
                    console.log('  Progress: ' + successCount + '/' + pluginFiles.length + '...');
                  }
                }
              }
              
              console.log(language + ': ' + successCount + '/' + pluginFiles.length + ' plugins bundled');
              totalSuccess += successCount;
              totalFiles += pluginFiles.length;
            }
          
            console.log('\nTotal: ' + totalSuccess + '/' + totalFiles + ' plugins bundled successfully');
          }
          
          bundleAllPlugins().catch(console.error);
          EOF
          
          echo "Starting bundling process..."
          node bundle-all-plugins.js
          
          echo ""
          echo "✅ All plugins bundled"
          
          cd ..
      
      - name: Verify bundled plugins
        run: |
          cd lnreader-source
          
          echo "Verifying bundled plugins..."
          
          total=$(find .bundled/plugins -name "*.js" -type f 2>/dev/null | wc -l)
          echo "Total bundled files: $total"
          
          first_file=$(find .bundled/plugins -name "*.js" -type f 2>/dev/null | head -1)
          if [ -n "$first_file" ]; then
            echo ""
            echo "Sample from $(basename "$first_file"):"
            head -5 "$first_file"
            echo "..."
          fi
          
          echo ""
          echo "✅ Verification complete"
          
          cd ..
      
      - name: Organize plugins
        run: |
          mkdir -p plugins
          cp -r lnreader-source/.bundled/plugins/* plugins/ 2>/dev/null || true
          
          echo "✅ Organized plugins"
          
          echo ""
          echo "Plugin count by language:"
          for lang_dir in plugins/*/; do
            if [ -d "$lang_dir" ]; then
              lang=$(basename "$lang_dir")
              count=$(find "$lang_dir" -name "*.js" -type f 2>/dev/null | wc -l)
              echo "  $lang: $count plugins"
            fi
          done
      
      - name: Update manifest URLs
        run: |
          node << 'SCRIPT'
          const fs = require('fs');
          const path = require('path');
          
          const updateUrls = (filePath, outputPath, minified = false) => {
            if (!fs.existsSync(filePath)) {
              console.log('Source file not found: ' + filePath);
              return;
            }
            
            const content = fs.readFileSync(filePath, 'utf-8');
            const data = JSON.parse(content);
            
            data.forEach(plugin => {
              if (plugin.url) {
                plugin.url = plugin.url
                  .replace(
                    /https:\/\/raw\.githubusercontent\.com\/LNReader\/lnreader-plugins\/[^/]+\/\.js\/src\/plugins\//g,
                    'https://raw.githubusercontent.com/kazemcodes/lnreader-plugins-unminified/repo/plugins/'
                  )
                  .replace(
                    /https:\/\/raw\.githubusercontent\.com\/LNReader\/lnreader-plugins\/[^/]+\/\.js\/plugins\//g,
                    'https://raw.githubusercontent.com/kazemcodes/lnreader-plugins-unminified/repo/plugins/'
                  );
              }
            });
            
            const output = minified ? JSON.stringify(data) : JSON.stringify(data, null, '\t');
            fs.writeFileSync(outputPath, output);
            console.log('Updated ' + path.basename(outputPath));
          };
          
          updateUrls('lnreader-source/.dist/plugins.json', 'plugins/plugins.json', false);
          updateUrls('lnreader-source/.dist/plugins.min.json', 'plugins/plugins.min.json', true);
          SCRIPT
      
      - name: Generate README
        run: |
          cat > plugins/README.md << 'EOF'
          # LNReader Plugins - Bundled & Unminified (GraalVM/J2V8)
          
          **Modern JavaScript plugins for LNReader/IReader (GraalVM & J2V8 compatible)**
          
          Built from: https://github.com/LNReader/lnreader-plugins
          
          ## Features
          - ✅ All dependencies bundled (cheerio, dayjs, etc.)
          - ✅ Non-minified for easy debugging
          - ✅ ES2020 target (full ES6+ support)
          - ✅ ICU-free polyfills included (fixes GraalVM TimeZone errors)
          - ✅ Self-contained - no external modules needed
          
          ## ICU-Free Polyfills
          Each plugin includes polyfills that override Intl and Date.toLocaleString()
          to prevent GraalVM ICU dependency errors:
          - NoClassDefFoundError: org/graalvm/shadowed/com/ibm/icu/util/TimeZone
          - Date formatting issues with dayjs
          EOF
          
          total=$(find plugins -name "*.js" -type f 2>/dev/null | wc -l)
          echo "" >> plugins/README.md
          echo "**Total: $total plugins**" >> plugins/README.md
      
      - name: Commit to repo branch
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          
          git add plugins/
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update plugins - $(date +'%Y-%m-%d %H:%M:%S')"
            git push origin repo
            echo "✅ Pushed to repo branch"
          fi
      
      - name: Package plugins
        run: |
          tar -czf lnreader-plugins-j2v8.tar.gz plugins/
          
          cd plugins
          for lang_dir in */; do
            if [ -d "$lang_dir" ]; then
              lang=$(basename "$lang_dir")
              if [ -n "$(ls -A "$lang_dir"*.js 2>/dev/null)" ]; then
                echo "Packaging $lang..."
                tar -czf "../${lang}-plugins.tar.gz" "$lang_dir"
              fi
            fi
          done
          cd ..
          
          echo "✅ Created plugin archives"
          ls -lh *.tar.gz
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: LNReader Plugins v${{ github.run_number }} (GraalVM/J2V8)
          body: |
            # LNReader Plugins - Bundled & Unminified
            
            Built from: https://github.com/LNReader/lnreader-plugins
            
            ## Features
            - ✅ All dependencies bundled (cheerio, dayjs, etc.)
            - ✅ ICU-free polyfills (fixes GraalVM TimeZone errors)
            - ✅ ES2020 with full ES6+ support
            - ✅ Works with GraalVM (IReader Desktop) and J2V8 (Android)
            
            ## ICU-Free Polyfills
            Each plugin includes polyfills that override Intl and Date methods
            to prevent GraalVM ICU dependency errors.
          files: |
            *.tar.gz
            plugins/plugins.json
            plugins/plugins.min.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
